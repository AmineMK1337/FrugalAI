seed: 42

metadata_csv: "../dataset/HAM10000_metadata.csv"
data_dir: "../dataset"

# Data
image_size: 224
splits_csv: "splits/ham10000_splits.csv"   # fixed 70/15/15 split from make_splits.py
num_workers: 4

# Model
model_name: "resnet18"
num_classes: 7

#Training
batch_size: 32
num_epochs: 25
learning_rate: 0.0001
optimizer: "adam"
lr_schedule: "cosine"   # lr decays from 1e-4 to ~0 over the run

use_class_weights: true

use_augmentation: true
augmentation: "strong"   # full rotations, vertical flips, wider crops (see data.py)

use_wandb: false
